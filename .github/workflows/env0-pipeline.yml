# =============================================================================
# Env0 CI/CD Pipeline — auto-generated
# Repo: naveenkm21/QuizMaster-GDG
# Stack: React
# =============================================================================

name: Env0 CI/CD Pipeline

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        continue-on-error: true
      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        continue-on-error: true
      - name: Run tests
        run: npm run test --if-present
        continue-on-error: true
        env:
          CI: true

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        continue-on-error: true
      - name: Build application
        run: npm run build --if-present
        continue-on-error: true
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-output
          path: |
            dist
            build
            .next
          if-no-files-found: ignore
          retention-days: 7

  notify:
    name: 💬 Notify
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = ${{ toJson(needs) }};
            const lines = Object.entries(jobs).map(([name, info]) => {
              const icon = info.result === 'success' ? '✅' : info.result === 'skipped' ? '⏭️' : '❌';
              return `${icon} **${name}** — ${info.result}`;
            });
            const allPassed = Object.values(jobs).every(j => j.result === 'success' || j.result === 'skipped');
            const header = allPassed ? '## 🎉 Pipeline Passed' : '## ⚠️ Pipeline Issues';
            const body = [header, '', ...lines, '', `— Env0 CI/CD`].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
